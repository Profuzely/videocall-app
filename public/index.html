<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instant 1-to-1 Video Call</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #status {
      position: absolute;
      top: 15px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #444;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 10;
      text-align: center;
      max-width: 90%;
    }
    /* Start overlay: ensures browser grants permissions and unlocks audio/video */
    #startOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #startBtn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 16px 36px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }
    #startBtn:hover {
      background: #1d4ed8;
    }
    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #1a1a1a;
    }
    #localVideo {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 180px;
      height: 120px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid #555;
      background: #000;
      transform: scaleX(-1);
    }
  </style>

  <!-- Load PeerJS and Socket.io -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <div id="startOverlay">
    <h2>Ready for your call?</h2>
    <button id="startBtn">Tap to Join Call</button>
  </div>

  <div id="status">Waiting to start...</div>

  <div class="video-container">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
  </div>

  <script>
    const statusText = document.getElementById('status');
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const startOverlay = document.getElementById('startOverlay');
    const startBtn = document.getElementById('startBtn');

    let localStream = null;
    let myPeerId = null;
    let peer = null;
    const socket = io();

    function setStatus(msg) {
      statusText.innerText = msg;
      console.log(msg);
    }

    startBtn.addEventListener('click', async () => {
      startOverlay.style.display = 'none';

      try {
        setStatus("Starting camera...");
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localVideo.srcObject = localStream;
        await localVideo.play();
        initPeer();
      } catch (err) {
        console.error(err);
        setStatus("Error: Camera or mic permission denied.");
      }
    });

    function initPeer() {
      // Configuration including TURNS over port 443 TCP to bypass corporate firewalls
      peer = new Peer({
        config: {
          iceServers: [
            // Standard STUN
            { urls: 'stun:stun.relay.metered.ca:80' },

            // Standard TURN (UDP)
            {
              urls: 'turn:relay.metered.ca:80',
              username: 'REPLACE_WITH_YOUR_METERED_USERNAME',
              credential: 'REPLACE_WITH_YOUR_METERED_CREDENTIAL',
            },
            {
              urls: 'turn:relay.metered.ca:443',
              username: 'REPLACE_WITH_YOUR_METERED_USERNAME',
              credential: 'REPLACE_WITH_YOUR_METERED_CREDENTIAL',
            },

            // TURN over TCP (bypasses UDP blocks on corporate networks)
            {
              urls: 'turn:relay.metered.ca:443?transport=tcp',
              username: 'REPLACE_WITH_YOUR_METERED_USERNAME',
              credential: 'REPLACE_WITH_YOUR_METERED_CREDENTIAL',
            },

            // TURNS over TLS/SSL (encrypted on Port 443, looks like normal HTTPS traffic)
            {
              urls: 'turns:relay.metered.ca:443?transport=tcp',
              username: 'REPLACE_WITH_YOUR_METERED_USERNAME',
              credential: 'REPLACE_WITH_YOUR_METERED_CREDENTIAL',
            }
          ]
        }
      });

      peer.on('open', (id) => {
        myPeerId = id;
        tryJoinMatchmaking();
      });

      peer.on('error', (err) => {
        console.error(err);
        setStatus("PeerJS Error: " + err.type);
      });

      // Handle receiving incoming call
      peer.on('call', (call) => {
        setStatus("Answering call...");
        call.answer(localStream);
        setupStreamHandling(call);
      });
    }

    function tryJoinMatchmaking() {
      if (myPeerId && localStream && socket.connected) {
        setStatus("Waiting for the other person to open the link...");
        socket.emit('join', myPeerId);
      }
    }

    socket.on('connect', () => {
      tryJoinMatchmaking();
    });

    socket.on('waiting', () => {
      setStatus("Waiting for the other person to open the link...");
    });

    // Make outgoing call
    socket.on('match', ({ peerToCall }) => {
      setStatus("Partner found! Dialing...");
      const call = peer.call(peerToCall, localStream);
      setupStreamHandling(call);
    });

    function setupStreamHandling(call) {
      call.on('stream', (incomingStream) => {
        remoteVideo.srcObject = incomingStream;
        remoteVideo.play()
          .then(() => setStatus("Connected! Video is live."))
          .catch(e => console.log("Playback retry:", e));
      });

      call.on('error', (err) => {
        console.error(err);
        setStatus("Call connection failed.");
      });
    }
  </script>
</body>
</html>
