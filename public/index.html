<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instant 1-to-1 Video Call</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #status {
      position: absolute;
      top: 15px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #444;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 10;
      text-align: center;
    }
    #statsBadge {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #333;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-family: monospace;
      z-index: 10;
    }
    #startOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #startBtn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 16px 36px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }
    #startBtn:hover {
      background: #1d4ed8;
    }
    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #050505;
    }
    /* contain keeps native aspect ratio and avoids blurry digital zoom */
    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #localVideo {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 200px;
      height: 130px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid #444;
      background: #111;
      transform: scaleX(-1);
    }
  </style>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <div id="startOverlay">
    <h2>Ready for your call?</h2>
    <button id="startBtn">Tap to Join Call</button>
  </div>

  <div id="status">Waiting to start...</div>
  <div id="statsBadge">Resolution: checking...</div>

  <div class="video-container">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
  </div>

  <script>
    const statusText = document.getElementById('status');
    const statsBadge = document.getElementById('statsBadge');
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const startOverlay = document.getElementById('startOverlay');
    const startBtn = document.getElementById('startBtn');

    let localStream = null;
    let myPeerId = null;
    let peer = null;
    const socket = io();

    function setStatus(msg) {
      statusText.innerText = msg;
      console.log(msg);
    }

    startBtn.addEventListener('click', async () => {
      startOverlay.style.display = 'none';

      try {
        setStatus("Requesting maximum camera resolution...");

        // Request clean HD feed
        localStream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { min: 1280, ideal: 1920 },
            height: { min: 720, ideal: 1080 },
            frameRate: { ideal: 30 }
          },
          audio: {
            echoCancellation: true,
            noiseSuppression: true
          }
        });

        // Tell browser to prioritize fine visual detail over aggressive compression
        const videoTrack = localStream.getVideoTracks()[0];
        if (videoTrack && 'contentHint' in videoTrack) {
          videoTrack.contentHint = 'detail';
        }

        localVideo.srcObject = localStream;
        await localVideo.play();

        const s = videoTrack.getSettings();
        statsBadge.innerText = `Camera capturing: ${s.width}x${s.height}`;

        initPeer();
      } catch (err) {
        console.error(err);
        setStatus("Error accessing camera. Check permissions.");
      }
    });

    function initPeer() {
      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.relay.metered.ca:80' },
            {
              urls: 'turn:relay.metered.ca:80',
              username: 'REPLACE_WITH_YOUR_METERED_USERNAME',
              credential: 'REPLACE_WITH_YOUR_METERED_CREDENTIAL',
            },
            {
              urls: 'turn:relay.metered.ca:443',
              username: 'REPLACE_WITH_YOUR_METERED_USERNAME',
              credential: 'REPLACE_WITH_YOUR_METERED_CREDENTIAL',
            },
            {
              urls: 'turn:relay.metered.ca:443?transport=tcp',
              username: 'REPLACE_WITH_YOUR_METERED_USERNAME',
              credential: 'REPLACE_WITH_YOUR_METERED_CREDENTIAL',
            },
            {
              urls: 'turns:relay.metered.ca:443?transport=tcp',
              username: 'REPLACE_WITH_YOUR_METERED_USERNAME',
              credential: 'REPLACE_WITH_YOUR_METERED_CREDENTIAL',
            }
          ]
        }
      });

      peer.on('open', (id) => {
        myPeerId = id;
        tryJoinMatchmaking();
      });

      peer.on('error', (err) => {
        console.error(err);
        setStatus("PeerJS Error: " + err.type);
      });

      peer.on('call', (call) => {
        setStatus("Answering call...");
        call.answer(localStream);
        setupStreamHandling(call);
      });
    }

    function tryJoinMatchmaking() {
      if (myPeerId && localStream && socket.connected) {
        setStatus("Waiting for partner...");
        socket.emit('join', myPeerId);
      }
    }

    socket.on('connect', () => {
      tryJoinMatchmaking();
    });

    socket.on('waiting', () => {
      setStatus("Waiting for partner to join...");
    });

    socket.on('match', ({ peerToCall }) => {
      setStatus("Partner found! Connecting...");
      const call = peer.call(peerToCall, localStream);
      setupStreamHandling(call);
    });

    function setupStreamHandling(call) {
      // Force WebRTC to keep full resolution and allocate high bitrate
      setTimeout(() => {
        try {
          if (call.peerConnection) {
            const senders = call.peerConnection.getSenders();
            const videoSender = senders.find(s => s.track && s.track.kind === 'video');

            if (videoSender) {
              const params = videoSender.getParameters();
              if (!params.encodings || params.encodings.length === 0) {
                params.encodings = [{}];
              }

              // 1. Maintain resolution even if network fluctuates (no auto-blur)
              params.degradationPreference = 'maintain-resolution';

              // 2. Allow up to 3.5 Mbps for crisp HD
              params.encodings[0].maxBitrate = 3500000;

              videoSender.setParameters(params);
            }
          }
        } catch (e) {
          console.log("Optimization notice:", e);
        }
      }, 1000);

      call.on('stream', (incomingStream) => {
        remoteVideo.srcObject = incomingStream;
        remoteVideo.play()
          .then(() => {
            setStatus("Connected! Video live.");
            // Update stats badge with actual incoming stream dimensions
            const track = incomingStream.getVideoTracks()[0];
            if (track) {
              const settings = track.getSettings();
              statsBadge.innerText = `Live Stream: ${settings.width || 'HD'}x${settings.height || ''}`;
            }
          })
          .catch(e => console.log("Playback retry:", e));
      });

      call.on('error', (err) => {
        console.error(err);
        setStatus("Call connection failed.");
      });
    }
  </script>
</body>
</html>
