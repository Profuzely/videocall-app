<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instant 1-to-1 Video Call</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #status {
      position: absolute;
      top: 15px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #444;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 10;
      text-align: center;
      max-width: 90%;
    }
    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #1a1a1a;
    }
    #localVideo {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 180px;
      height: 120px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid #555;
      background: #000;
      transform: scaleX(-1);
    }
  </style>

  <!-- Load PeerJS and Socket.io -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <div id="status">Initializing...</div>

  <div class="video-container">
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
  </div>

  <script>
    const statusText = document.getElementById('status');
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');

    let localStream = null;
    let myPeerId = null;

    const socket = io();
    const peer = new Peer();

    function setStatus(msg) {
      statusText.innerText = msg;
      console.log(msg);
    }

    // Helper: Join matchmaking only when BOTH camera and PeerJS ID are ready
    function tryJoinMatchmaking() {
      if (myPeerId && localStream && socket.connected) {
        setStatus("Finding a partner...");
        socket.emit('join', myPeerId);
      }
    }

    // 1. Handle PeerJS connection
    peer.on('open', (id) => {
      myPeerId = id;
      tryJoinMatchmaking();
    });

    peer.on('error', (err) => {
      console.error(err);
      setStatus("PeerJS Error: " + err.type);
    });

    // 2. Handle Socket.io connection to Render
    socket.on('connect', () => {
      tryJoinMatchmaking();
    });

    socket.on('connect_error', () => {
      setStatus("Could not connect to matchmaking server. Retrying...");
    });

    // 3. Request camera and microphone
    setStatus("Requesting camera & microphone access...");
    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
      .then((stream) => {
        localStream = stream;
        localVideo.srcObject = stream;
        setStatus("Camera active. Connecting...");
        tryJoinMatchmaking();
      })
      .catch((err) => {
        console.error(err);
        setStatus("Error: Camera or mic permission was denied.");
      });

    // 4. Server events
    socket.on('waiting', () => {
      setStatus("Waiting for the other person to open the link...");
    });

    socket.on('match', ({ peerToCall }) => {
      setStatus("Partner found! Connecting call...");
      const call = peer.call(peerToCall, localStream);
      
      call.on('stream', (incomingStream) => {
        remoteVideo.srcObject = incomingStream;
        setStatus("Connected!");
      });

      call.on('error', (err) => {
        console.error(err);
        setStatus("Call error occurred.");
      });
    });

    // 5. Answer incoming calls
    peer.on('call', (call) => {
      setStatus("Partner connected! Streaming...");
      call.answer(localStream);

      call.on('stream', (incomingStream) => {
        remoteVideo.srcObject = incomingStream;
        setStatus("Connected!");
      });
    });
  </script>
</body>
</html>
